# ------------------------------------------------------------------ time series
- id: T01
  category: time_series
  question: What was total revenue in each year?
  expect: answer
  gold_sql: |
    SELECT EXTRACT(year FROM o.order_purchase_timestamp) AS year, SUM(oi.price) AS revenue
    FROM order_items oi JOIN orders o USING (order_id)
    WHERE o.order_status NOT IN ('canceled', 'unavailable')
    GROUP BY 1

- id: T02
  category: time_series
  question: How many orders were placed in each month of 2017?
  expect: answer
  gold_sql: |
    SELECT strftime(order_purchase_timestamp, '%Y-%m') AS month, COUNT(*) AS orders
    FROM orders o
    WHERE o.order_status NOT IN ('canceled', 'unavailable')
      AND order_purchase_timestamp >= '2017-01-01' AND order_purchase_timestamp < '2018-01-01'
    GROUP BY 1

- id: T03
  category: time_series
  question: Which month had the highest revenue, and how much was it?
  expect: answer
  gold_sql: |
    SELECT strftime(o.order_purchase_timestamp, '%Y-%m') AS month, SUM(oi.price) AS revenue
    FROM order_items oi JOIN orders o USING (order_id)
    WHERE o.order_status NOT IN ('canceled', 'unavailable')
    GROUP BY 1 ORDER BY 2 DESC LIMIT 1

- id: T04
  category: time_series
  question: What was revenue last quarter?
  expect: answer
  gold_sql: |
    SELECT SUM(oi.price) AS revenue
    FROM order_items oi JOIN orders o USING (order_id)
    WHERE o.order_status NOT IN ('canceled', 'unavailable')
      AND o.order_purchase_timestamp >= '2018-04-01' AND o.order_purchase_timestamp < '2018-07-01'

- id: T05
  category: time_series
  question: What was revenue in each month from January to August 2018?
  expect: answer
  gold_sql: |
    SELECT strftime(o.order_purchase_timestamp, '%Y-%m') AS month, SUM(oi.price) AS revenue
    FROM order_items oi JOIN orders o USING (order_id)
    WHERE o.order_status NOT IN ('canceled', 'unavailable')
      AND o.order_purchase_timestamp >= '2018-01-01' AND o.order_purchase_timestamp < '2018-09-01'
    GROUP BY 1

- id: T06
  category: time_series
  question: By what percentage did the number of orders grow from October 2017 to November 2017?
  expect: answer
  gold_sql: |
    WITH m AS (
      SELECT strftime(order_purchase_timestamp, '%Y-%m') AS month, COUNT(*) AS orders
      FROM orders o WHERE o.order_status NOT IN ('canceled', 'unavailable') GROUP BY 1)
    SELECT (SELECT orders FROM m WHERE month = '2017-11') * 1.0
         / (SELECT orders FROM m WHERE month = '2017-10') - 1 AS growth

- id: T07
  category: time_series
  question: On which day of the week are the most orders placed? Give the weekday name.
  expect: answer
  gold_sql: |
    SELECT dayname(order_purchase_timestamp) AS weekday, COUNT(*) AS orders
    FROM orders o WHERE o.order_status NOT IN ('canceled', 'unavailable')
    GROUP BY 1 ORDER BY 2 DESC LIMIT 1

- id: T08
  category: time_series
  question: At which hour of the day (0-23) are the most orders placed?
  expect: answer
  gold_sql: |
    SELECT hour(order_purchase_timestamp) AS hour, COUNT(*) AS orders
    FROM orders o WHERE o.order_status NOT IN ('canceled', 'unavailable')
    GROUP BY 1 ORDER BY 2 DESC LIMIT 1

- id: T09
  category: time_series
  question: How many orders were placed on Black Friday 2017 (24 November 2017)?
  expect: answer
  gold_sql: |
    SELECT COUNT(*) AS orders FROM orders o
    WHERE o.order_status NOT IN ('canceled', 'unavailable')
      AND CAST(order_purchase_timestamp AS DATE) = DATE '2017-11-24'

- id: T10
  category: time_series
  question: What was the year-over-year revenue growth from January-August 2017 to January-August 2018?
  expect: answer
  gold_sql: |
    WITH r AS (
      SELECT EXTRACT(year FROM o.order_purchase_timestamp) AS y, SUM(oi.price) AS revenue
      FROM order_items oi JOIN orders o USING (order_id)
      WHERE o.order_status NOT IN ('canceled', 'unavailable')
        AND EXTRACT(month FROM o.order_purchase_timestamp) BETWEEN 1 AND 8
      GROUP BY 1)
    SELECT (SELECT revenue FROM r WHERE y = 2018) / (SELECT revenue FROM r WHERE y = 2017) - 1 AS growth

# ------------------------------------------------------------------ multi-step analysis
- id: M01
  category: multi_step
  question: Which 5 product categories grew revenue fastest last quarter compared with the quarter before, among categories with at least R$ 10,000 of revenue in the earlier quarter? Give the growth rate, fastest first.
  expect: answer
  ordered: true
  gold_sql: |
    WITH q AS (
      SELECT t.product_category_name_english AS category,
             SUM(CASE WHEN o.order_purchase_timestamp >= '2018-01-01' AND o.order_purchase_timestamp < '2018-04-01' THEN oi.price ELSE 0 END) AS q1,
             SUM(CASE WHEN o.order_purchase_timestamp >= '2018-04-01' AND o.order_purchase_timestamp < '2018-07-01' THEN oi.price ELSE 0 END) AS q2
      FROM order_items oi
      JOIN orders o USING (order_id)
      JOIN products p USING (product_id)
      JOIN category_translation t USING (product_category_name)
      WHERE o.order_status NOT IN ('canceled', 'unavailable')
      GROUP BY 1)
    SELECT category, q2 / q1 - 1 AS growth FROM q WHERE q1 >= 10000 ORDER BY 2 DESC LIMIT 5

- id: M02
  category: multi_step
  question: What share of total revenue came from the top 10 sellers by revenue?
  expect: answer
  gold_sql: |
    WITH s AS (
      SELECT oi.seller_id, SUM(oi.price) AS revenue
      FROM order_items oi JOIN orders o USING (order_id)
      WHERE o.order_status NOT IN ('canceled', 'unavailable')
      GROUP BY 1)
    SELECT (SELECT SUM(revenue) FROM (SELECT revenue FROM s ORDER BY revenue DESC LIMIT 10))
           / (SELECT SUM(revenue) FROM s) AS top10_share

- id: M03
  category: multi_step
  question: What was the average revenue per customer (person) for orders placed in 2017?
  expect: answer
  gold_sql: |
    SELECT SUM(oi.price) / COUNT(DISTINCT c.customer_unique_id) AS revenue_per_customer
    FROM order_items oi JOIN orders o USING (order_id) JOIN customers c USING (customer_id)
    WHERE o.order_status NOT IN ('canceled', 'unavailable')
      AND o.order_purchase_timestamp >= '2017-01-01' AND o.order_purchase_timestamp < '2018-01-01'

- id: M04
  category: multi_step
  question: Which 3 customer states had the largest absolute increase in revenue from January-August 2017 to January-August 2018? Largest first.
  expect: answer
  ordered: true
  gold_sql: |
    SELECT c.customer_state,
           SUM(CASE WHEN EXTRACT(year FROM o.order_purchase_timestamp) = 2018 THEN oi.price ELSE 0 END)
         - SUM(CASE WHEN EXTRACT(year FROM o.order_purchase_timestamp) = 2017 THEN oi.price ELSE 0 END) AS increase
    FROM order_items oi JOIN orders o USING (order_id) JOIN customers c USING (customer_id)
    WHERE o.order_status NOT IN ('canceled', 'unavailable')
      AND EXTRACT(month FROM o.order_purchase_timestamp) BETWEEN 1 AND 8
    GROUP BY 1 ORDER BY 2 DESC LIMIT 3

- id: M05
  category: multi_step
  question: For delivered orders, what is the average review score of orders delivered late (after the estimated date) compared with orders delivered on time?
  expect: answer
  gold_sql: |
    SELECT o.order_delivered_customer_date > o.order_estimated_delivery_date AS late,
           AVG(r.review_score) AS avg_score
    FROM orders o JOIN order_reviews r USING (order_id)
    WHERE o.order_status = 'delivered' AND o.order_delivered_customer_date IS NOT NULL
    GROUP BY 1

- id: M06
  category: multi_step
  question: What is the repeat purchase rate, i.e. the share of customers (people) with two or more orders, counting all orders regardless of status?
  expect: answer
  gold_sql: |
    SELECT AVG(CASE WHEN n >= 2 THEN 1.0 ELSE 0.0 END) AS repeat_rate FROM (
      SELECT c.customer_unique_id, COUNT(DISTINCT o.order_id) AS n
      FROM orders o JOIN customers c USING (customer_id) GROUP BY 1)

- id: M07
  category: multi_step
  question: What share of this year's revenue came from customers in São Paulo state (SP)?
  expect: answer
  gold_sql: |
    SELECT SUM(CASE WHEN c.customer_state = 'SP' THEN oi.price ELSE 0 END) / SUM(oi.price) AS sp_share
    FROM order_items oi JOIN orders o USING (order_id) JOIN customers c USING (customer_id)
    WHERE o.order_status NOT IN ('canceled', 'unavailable')
      AND o.order_purchase_timestamp >= '2018-01-01' AND o.order_purchase_timestamp < '2018-09-01'

- id: M08
  category: multi_step
  question: For the 5 categories with the most orders in 2018, give the number of orders and the average item price. Most orders first.
  expect: answer
  ordered: true
  gold_sql: |
    SELECT t.product_category_name_english AS category,
           COUNT(DISTINCT o.order_id) AS orders, AVG(oi.price) AS avg_item_price
    FROM order_items oi
    JOIN orders o USING (order_id)
    JOIN products p USING (product_id)
    JOIN category_translation t USING (product_category_name)
    WHERE o.order_status NOT IN ('canceled', 'unavailable')
      AND o.order_purchase_timestamp >= '2018-01-01' AND o.order_purchase_timestamp < '2019-01-01'
    GROUP BY 1 ORDER BY 2 DESC LIMIT 5

- id: M09
  category: multi_step
  question: What is the Pearson correlation between product weight and freight value across all order items?
  expect: answer
  gold_sql: |
    SELECT corr(p.product_weight_g, oi.freight_value) AS correlation
    FROM order_items oi JOIN products p USING (product_id)

- id: M10
  category: multi_step
  question: Which product categories were in the top 10 by revenue in both 2017 and 2018?
  expect: answer
  gold_sql: |
    WITH r AS (
      SELECT EXTRACT(year FROM o.order_purchase_timestamp) AS y,
             t.product_category_name_english AS category, SUM(oi.price) AS revenue
      FROM order_items oi
      JOIN orders o USING (order_id)
      JOIN products p USING (product_id)
      JOIN category_translation t USING (product_category_name)
      WHERE o.order_status NOT IN ('canceled', 'unavailable')
      GROUP BY 1, 2),
    ranked AS (SELECT *, row_number() OVER (PARTITION BY y ORDER BY revenue DESC) AS rk FROM r)
    SELECT category FROM ranked WHERE y = 2017 AND rk <= 10
    INTERSECT
    SELECT category FROM ranked WHERE y = 2018 AND rk <= 10

- id: M11
  category: multi_step
  question: Of the delivered orders that received a 1-star review, what percentage arrived after the estimated delivery date?
  expect: answer
  gold_sql: |
    SELECT AVG(CASE WHEN order_delivered_customer_date > order_estimated_delivery_date THEN 1.0 ELSE 0.0 END) AS late_share
    FROM orders
    WHERE order_status = 'delivered' AND order_delivered_customer_date IS NOT NULL
      AND order_id IN (SELECT order_id FROM order_reviews WHERE review_score = 1)

- id: M12
  category: multi_step
  question: What was the on-time delivery rate (delivered on or before the estimated date) for delivered orders, by year of purchase?
  expect: answer
  gold_sql: |
    SELECT EXTRACT(year FROM order_purchase_timestamp) AS year,
           AVG(CASE WHEN order_delivered_customer_date <= order_estimated_delivery_date THEN 1.0 ELSE 0.0 END) AS on_time_rate
    FROM orders
    WHERE order_status = 'delivered' AND order_delivered_customer_date IS NOT NULL
    GROUP BY 1

