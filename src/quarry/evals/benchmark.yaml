  gold_sql: |
    SELECT t.product_category_name_english AS category, SUM(oi.price) AS revenue
    FROM order_items oi
    JOIN orders o USING (order_id)
    JOIN products p USING (product_id)
    JOIN category_translation t USING (product_category_name)
    WHERE o.order_status NOT IN ('canceled', 'unavailable')
      AND o.order_purchase_timestamp >= '2018-01-01' AND o.order_purchase_timestamp < '2019-01-01'
    GROUP BY 1 ORDER BY 2 DESC LIMIT 5

- id: F04
  category: followup
  context: ["What is the total revenue from customers in SP?"]
  question: How does that compare with RJ? Give both.
  expect: answer
  gold_sql: |
    SELECT c.customer_state, SUM(oi.price) AS revenue
    FROM order_items oi JOIN orders o USING (order_id) JOIN customers c USING (customer_id)
    WHERE o.order_status NOT IN ('canceled', 'unavailable') AND c.customer_state IN ('SP', 'RJ')
    GROUP BY 1

