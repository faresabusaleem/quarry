  question: Which 10 states have the most sellers? List them from most to fewest.
  expect: answer
  ordered: true
  gold_sql: |
    SELECT seller_state, COUNT(*) AS sellers FROM sellers
    GROUP BY 1 ORDER BY 2 DESC LIMIT 10

- id: A06
  category: aggregation
  question: What is the average freight value per order item?
  expect: answer
  gold_sql: SELECT AVG(freight_value) AS avg_freight FROM order_items

- id: A07
  category: aggregation
  question: What share of all payments (by number of payment records) were made by boleto?
  expect: answer
  gold_sql: |
    SELECT AVG(CASE WHEN payment_type = 'boleto' THEN 1.0 ELSE 0.0 END) AS boleto_share
    FROM order_payments

- id: A08
  category: aggregation
  question: Which 5 customer cities placed the most orders? List them from most to fewest.
  expect: answer
  ordered: true
  gold_sql: |
    SELECT c.customer_city, COUNT(DISTINCT o.order_id) AS orders
    FROM orders o JOIN customers c USING (customer_id)
    WHERE o.order_status NOT IN ('canceled', 'unavailable')
    GROUP BY 1 ORDER BY 2 DESC LIMIT 5

- id: A09
  category: aggregation
  question: How many products have no category?
  expect: answer
  gold_sql: SELECT COUNT(*) AS uncategorised FROM products WHERE product_category_name IS NULL

- id: A10
  category: aggregation
  question: Which 5 product categories have the heaviest products on average? Give the average weight in grams.
  expect: answer
  ordered: true
  gold_sql: |
    SELECT t.product_category_name_english, AVG(p.product_weight_g) AS avg_weight_g
    FROM products p JOIN category_translation t USING (product_category_name)
    GROUP BY 1 ORDER BY 2 DESC LIMIT 5

- id: A11
  category: aggregation
  question: How many customers (people) placed more than one order, counting all orders regardless of status?
  expect: answer
  gold_sql: |
    SELECT COUNT(*) AS repeat_customers FROM (
      SELECT c.customer_unique_id FROM orders o JOIN customers c USING (customer_id)
      GROUP BY 1 HAVING COUNT(DISTINCT o.order_id) > 1)

- id: A12
  category: aggregation
  question: What was the total freight charged on delivered orders?
  expect: answer
  gold_sql: |
    SELECT SUM(oi.freight_value) AS freight
    FROM order_items oi JOIN orders o USING (order_id)
    WHERE o.order_status = 'delivered'

- id: A13
  category: aggregation
  question: What is the average order value, using the standard revenue definition?
  expect: answer
  gold_sql: |
    SELECT AVG(order_revenue) AS avg_order_value FROM (
      SELECT o.order_id, SUM(oi.price) AS order_revenue
      FROM orders o JOIN order_items oi USING (order_id)
      WHERE o.order_status NOT IN ('canceled', 'unavailable')
      GROUP BY 1)

- id: A14
  category: aggregation
  question: Which payment type has the highest average payment value?
  expect: answer
  gold_sql: |
    SELECT payment_type, AVG(payment_value) AS avg_value
    FROM order_payments GROUP BY 1 ORDER BY 2 DESC LIMIT 1

# ------------------------------------------------------------------ joins
- id: J01
  category: join
  question: Which 5 product categories generated the most revenue overall? Rank them.
