# Held-out questions. Written after the v3 code freeze (commit 28cde06) and never used to
# decide a change to prompts, glossary, tools or loop. Same format and rules as
# benchmark.yaml, new questions (not rephrasings of the dev set).

# ------------------------------------------------------------------ lookups
- id: H01
  category: lookup
  question: How many order items are in the dataset in total?
  expect: answer
  gold_sql: SELECT COUNT(*) AS items FROM order_items

- id: H02
  category: lookup
  question: How many sellers are based in the state of Paraná (PR)?
  expect: answer
  gold_sql: SELECT COUNT(*) AS sellers FROM sellers WHERE seller_state = 'PR'

- id: H03
  category: lookup
  question: What is the most common number of payment instalments, and how many payments used it?
  expect: answer
  gold_sql: |
    SELECT payment_installments, COUNT(*) AS payments
    FROM order_payments GROUP BY 1 ORDER BY 2 DESC LIMIT 1

# ------------------------------------------------------------------ aggregations
- id: H04
  category: aggregation
  question: What is the average payment value of boleto payments?
  expect: answer
  gold_sql: SELECT AVG(payment_value) AS avg_value FROM order_payments WHERE payment_type = 'boleto'

- id: H05
  category: aggregation
  question: How many reviews include a written comment message?
  expect: answer
  gold_sql: SELECT COUNT(*) AS reviews FROM order_reviews WHERE review_comment_message IS NOT NULL

- id: H06
  category: aggregation
  question: What is the average number of photos per product in the catalogue?
  expect: answer
  gold_sql: SELECT AVG(product_photos_qty) AS avg_photos FROM products

# ------------------------------------------------------------------ joins
- id: H07
  category: join
  question: What was the total revenue of sellers based in Minas Gerais (MG)?
  expect: answer
  gold_sql: |
    SELECT SUM(oi.price) AS revenue
    FROM order_items oi JOIN orders o USING (order_id) JOIN sellers s USING (seller_id)
    WHERE o.order_status NOT IN ('canceled', 'unavailable') AND s.seller_state = 'MG'

- id: H08
  category: join
  question: How many orders did customers in the state of Bahia (BA) place?
  expect: answer
  gold_sql: |
    SELECT COUNT(DISTINCT o.order_id) AS orders
    FROM orders o JOIN customers c USING (customer_id)
    WHERE o.order_status NOT IN ('canceled', 'unavailable') AND c.customer_state = 'BA'

- id: H09
  category: join
  question: Which product category sold the most items, and how many?
  expect: answer
  gold_sql: |
    SELECT t.product_category_name_english AS category, COUNT(*) AS items
    FROM order_items oi
    JOIN orders o USING (order_id)
    JOIN products p USING (product_id)
    JOIN category_translation t USING (product_category_name)
    WHERE o.order_status NOT IN ('canceled', 'unavailable')
    GROUP BY 1 ORDER BY 2 DESC LIMIT 1

# ------------------------------------------------------------------ time series
- id: H10
  category: time_series
  question: What was revenue in each month of 2017?
  expect: answer
  gold_sql: |
    SELECT strftime(o.order_purchase_timestamp, '%Y-%m') AS month, SUM(oi.price) AS revenue
    FROM order_items oi JOIN orders o USING (order_id)
    WHERE o.order_status NOT IN ('canceled', 'unavailable')
      AND o.order_purchase_timestamp >= '2017-01-01' AND o.order_purchase_timestamp < '2018-01-01'
    GROUP BY 1

- id: H11
  category: time_series
  question: How many orders were placed in the first quarter of 2018 (January to March)?
  expect: answer
  gold_sql: |
    SELECT COUNT(*) AS orders FROM orders o
    WHERE o.order_status NOT IN ('canceled', 'unavailable')
      AND o.order_purchase_timestamp >= '2018-01-01' AND o.order_purchase_timestamp < '2018-04-01'

- id: H12
  category: time_series
  question: Which month between January and August 2018 had the most orders?
  expect: answer
  gold_sql: |
    SELECT strftime(order_purchase_timestamp, '%Y-%m') AS month, COUNT(*) AS orders
    FROM orders o
    WHERE o.order_status NOT IN ('canceled', 'unavailable')
      AND order_purchase_timestamp >= '2018-01-01' AND order_purchase_timestamp < '2018-09-01'
    GROUP BY 1 ORDER BY 2 DESC LIMIT 1

# ------------------------------------------------------------------ multi-step analysis
- id: H13
  category: multi_step
  question: What share of 2017 revenue came from the health_beauty category?
  expect: answer
  gold_sql: |
    SELECT SUM(CASE WHEN t.product_category_name_english = 'health_beauty' THEN oi.price ELSE 0 END)
           / SUM(oi.price) AS share
    FROM order_items oi
    JOIN orders o USING (order_id)
    LEFT JOIN products p USING (product_id)
    LEFT JOIN category_translation t USING (product_category_name)
    WHERE o.order_status NOT IN ('canceled', 'unavailable')
      AND o.order_purchase_timestamp >= '2017-01-01' AND o.order_purchase_timestamp < '2018-01-01'

- id: H14
  category: multi_step
  question: What is the average review score of delivered orders that arrived more than 30 days after they were purchased?
  expect: answer
  gold_sql: |
    SELECT AVG(r.review_score) AS avg_score
    FROM order_reviews r JOIN orders o USING (order_id)
    WHERE o.order_status = 'delivered'
      AND o.order_delivered_customer_date > o.order_purchase_timestamp + INTERVAL 30 DAY

- id: H15
  category: multi_step
  question: Among customer states with at least 500 orders in 2018, which 3 had the highest average order value? Highest first.
  expect: answer
  ordered: true
  gold_sql: |
    WITH s AS (
      SELECT c.customer_state, SUM(oi.price) / COUNT(DISTINCT o.order_id) AS avg_order_value,
             COUNT(DISTINCT o.order_id) AS orders
      FROM order_items oi JOIN orders o USING (order_id) JOIN customers c USING (customer_id)
      WHERE o.order_status NOT IN ('canceled', 'unavailable')
        AND o.order_purchase_timestamp >= '2018-01-01' AND o.order_purchase_timestamp < '2019-01-01'
      GROUP BY 1)
    SELECT customer_state, avg_order_value FROM s WHERE orders >= 500
    ORDER BY avg_order_value DESC LIMIT 3

- id: H16
  category: multi_step
  question: By what percentage did revenue grow from the first quarter of 2018 to the second quarter of 2018?
  expect: answer
  gold_sql: |
    SELECT SUM(CASE WHEN o.order_purchase_timestamp >= '2018-04-01' THEN oi.price ELSE 0 END)
         / SUM(CASE WHEN o.order_purchase_timestamp < '2018-04-01' THEN oi.price ELSE 0 END) - 1 AS growth
    FROM order_items oi JOIN orders o USING (order_id)
    WHERE o.order_status NOT IN ('canceled', 'unavailable')
      AND o.order_purchase_timestamp >= '2018-01-01' AND o.order_purchase_timestamp < '2018-07-01'

# ------------------------------------------------------------------ follow-up
- id: H17
  category: followup
  context: ["What was total revenue in 2017?"]
  question: And how many orders was that?
  expect: answer
  gold_sql: |
    SELECT COUNT(DISTINCT o.order_id) AS orders FROM orders o
    WHERE o.order_status NOT IN ('canceled', 'unavailable')
      AND o.order_purchase_timestamp >= '2017-01-01' AND o.order_purchase_timestamp < '2018-01-01'

