[project]
name = "quarry"
version = "0.1.0"
description = "An agentic data analyst: plans, explores a schema, writes and fixes SQL, charts and cites every number."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "duckdb>=1.1",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "sqlglot>=25.0",
    "pyyaml>=6.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "mcp>=1.2",
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.13",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
data = ["kagglehub>=0.3"]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
]

[project.scripts]
quarry = "quarry.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quarry"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: needs the built DuckDB file"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
